# https://render.com/schema/render.yaml.json
# GarageTalk v3: marketing homepage (static) + app (API + PWA on one Node service).
projects:
  - name: garagetalk
    environments:
      - name: production
        services:
          - type: web
            name: garagetalk-homepage
            runtime: static
            buildCommand: "true"
            staticPublishPath: apps/homepage
            autoDeployTrigger: commit
            buildFilter:
              paths:
                - apps/homepage/**
            routes:
              - type: rewrite
                source: /*
                destination: /index.html

          - type: web
            name: garagetalk-app
            runtime: node
            plan: starter
            region: oregon
            # Monorepo root (pnpm workspaces).
            buildCommand: corepack enable && corepack prepare pnpm@10.33.3 --activate && pnpm install --frozen-lockfile && pnpm --filter @garagetalk/web... build && pnpm --filter @garagetalk/api... build
            startCommand: node packages/db/dist/migrate.js && node apps/api/dist/index.js
            healthCheckPath: /healthz
            autoDeployTrigger: commit
            buildFilter:
              paths:
                - apps/api/**
                - apps/web/**
                - packages/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - turbo.json
                - tsconfig.base.json
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: NODE_ENV
                value: production
              - key: APP_BASE_URL
                value: https://app.garagetalk.app
              - key: AUTH_TRUSTED_ORIGINS
                value: https://app.garagetalk.app,https://garagetalk.app,https://www.garagetalk.app,https://garagetalk-app.onrender.com,https://garagetalk-homepage.onrender.com
              - key: DATABASE_URL
                fromDatabase:
                  name: garagetalk-db-v3
                  property: connectionString
              - key: DIRECT_DATABASE_URL
                fromDatabase:
                  name: garagetalk-db-v3
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  name: garagetalk-redis
                  type: keyvalue
                  property: connectionString
              - key: SESSION_SECRET
                generateValue: true
              - key: ADMIN_EMAIL
                sync: false
              - key: ADMIN_EMAILS
                sync: false
              - key: ADMIN_PASSWORD
                sync: false
              - key: AI_API_KEY
                sync: false
              - key: AI_BASE_URL
                sync: false
              - key: STRIPE_SECRET_KEY
                sync: false
              - key: STRIPE_WEBHOOK_SECRET
                sync: false
              - key: RESEND_API_KEY
                sync: false
              - key: TWILIO_ACCOUNT_SID
                sync: false
              - key: TWILIO_AUTH_TOKEN
                sync: false
              - key: TWILIO_VERIFY_SID
                sync: false
              - key: AI_MODEL_BASIC
                sync: false
              - key: AI_MODEL_STANDARD
                sync: false
              - key: AI_MODEL_ADVANCED
                sync: false
              - key: AI_MODEL_MAX
                sync: false
              - key: STRIPE_PRICE_GEARHEAD
                sync: false
              - key: STRIPE_PRICE_RACING_PRO
                sync: false
              - key: STRIPE_PRICE_PRO
                sync: false
              - key: LIVEKIT_URL
                sync: false
              - key: LIVEKIT_API_KEY
                sync: false
              - key: LIVEKIT_API_SECRET
                sync: false
              - key: LIVEKIT_RTMP_URL
                sync: false
              - key: R2_ACCOUNT_ID
                sync: false
              - key: R2_ACCESS_KEY_ID
                sync: false
              - key: R2_SECRET_ACCESS_KEY
                sync: false
              - key: R2_BUCKET
                sync: false
              - key: R2_PUBLIC_BASE_URL
                sync: false

          - type: keyvalue
            name: garagetalk-redis
            plan: starter
            maxmemoryPolicy: allkeys-lru
            ipAllowList:
              - source: 0.0.0.0/0
                description: everywhere

        databases:
          # Fresh v3 schema (legacy garagetalk-db left in place for rollback).
          - name: garagetalk-db-v3
            plan: basic-256mb
            region: oregon
            postgresMajorVersion: "16"
