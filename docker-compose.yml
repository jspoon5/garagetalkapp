services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: garagetalk
      POSTGRES_PASSWORD: garagetalk
      POSTGRES_DB: garagetalk_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garagetalk -d garagetalk_test"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
